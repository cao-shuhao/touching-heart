<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>触动心弦1.0</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: monospace; overflow: hidden; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        canvas { z-index: 2; touch-action: none; }
        .hud {
            position: relative; z-index: 10; padding: 15px; background: rgba(0,0,0,0.8);
            border-bottom: 3px solid #ff00aa; font-size: 14px; box-shadow: 0 4px 20px rgba(255,0,170,0.3);
            pointer-events: none;
        }
        #lightInfo { font-size: 18px; font-weight: bold; color: #ffaa00; }
        #colorInfo { font-size: 18px; margin-left: 15px; color: #aaddff; }
        #depthInfo { font-size: 16px; margin-left: 15px; color: #88ff88; }
        #modeInfo { font-size: 18px; margin-left: 15px; color: #ff66ff; font-weight: bold; }
        #materialHint { font-size: 16px; margin-left: 15px; color: #88ff88; }
        #edgeJumpInfo { font-size: 16px; margin-left: 15px; color: #ff5555; }
        #colorEdgeInfo { font-size: 16px; margin-left: 15px; color: #ffff88; }
        #lockStatus { font-size: 16px; margin-left: 15px; color: #ffaa00; font-weight: bold; }
        button {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 10; padding: 14px 40px; border-radius: 40px; border: none;
            background: linear-gradient(90deg, #ff00aa, #ffaa00); color: #fff; font-weight: bold; cursor: pointer; font-size: 16px;
            box-shadow: 0 4px 20px rgba(255,0,170,0.4);
            pointer-events: auto;
        }
        .note {
            position: absolute; bottom: 90px; left: 0; right: 0; text-align: center;
            color: #ddd; font-size: 13px; z-index: 20; text-shadow: 1px 1px 2px #000;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="hud" style="display:flex; gap:20px; align-items:center;">
    <div>亮度: <span id="lightInfo">对准物体</span></div>
    <div>颜色: <span id="colorInfo">--</span></div>
    <!-- 以下内容保留用于 JS 数据更新，但视觉上隐藏 -->
    <span id="depthInfo" style="display:none;">--</span>
    <span id="modeInfo" style="display:none;">🔘 待机</span>
    <span id="materialHint" style="display:none;">(已注释)</span>
    <span id="edgeJumpInfo" style="display:none;">—</span>
    <span id="colorEdgeInfo" style="display:none;">—</span>
    <span id="lockStatus" style="display:none;">🔓 自由</span>
    <span id="debug" style="display:none;">等待启动...</span>
</div>
<!-- 删除 <div class="note">…</div> -->
</div>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<button id="startBtn">启动</button>
<div class="note">长按进入单物体模式</div>

<script>
    (function(){
        "use strict";
        
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const lightSpan = document.getElementById('lightInfo');
        const colorSpan = document.getElementById('colorInfo');
        const depthSpan = document.getElementById('depthInfo');
        const modeSpan = document.getElementById('modeInfo');
        const materialHintSpan = document.getElementById('materialHint');
        const edgeJumpSpan = document.getElementById('edgeJumpInfo');
        const colorEdgeSpan = document.getElementById('colorEdgeInfo');
        const lockStatusSpan = document.getElementById('lockStatus');
        const debugSpan = document.getElementById('debug');
        const startBtn = document.getElementById('startBtn');
        
        let audioCtx = null, isRunning = false, frameId = null, stream = null;
        
        // ========== 触觉参数 ==========
        let lightVibeInterval = null;
        let currentIntensity = 0, currentSharpness = 0, currentDisturbance = 0, currentEdgeStrength = 0;
        let lastEdgeStrength = 0, lastIntensity = 0;
        let currentColorTag = -1;
        const DARK_THRESHOLD = 0.10; 
        
        let currentDepthScale = 1.0;
        let frameSkipCounter = 0;
        const DEPTH_UPDATE_INTERVAL = 3;
        
        const TRACK_POINTS = 9, TRACK_WIN = 12, TEMPL_HALF = 4;
        let prevGray = null, trackPoints = [], needInitPoints = true;
        
        // ========== 颜色系统 ==========
        const COLOR_NAMES = ['红', '橙', '黄', '绿', '青', '蓝', '紫', '白'];
        const COLOR_CHORDS = [
            [261.63, 329.63, 392.00, 493.88],
            [196.00, 246.94, 293.66, 349.23],
            [164.81, 207.65, 246.94],
            [174.61, 196.00, 261.63],
            [220.00, 277.18, 329.63, 415.30, 493.88],
            [146.83, 174.61, 220.00, 261.63],
            [233.08, 277.18, 349.23, 440.00],
            []
        ];
        const CHORD_TYPES = ['Maj7', 'Dom7', 'Maj', 'Sus2', 'Maj9', 'Min7', 'mMaj7', 'Glide'];
        const COLOR_INTERVALS = [320, 480, 640, 800, 960, 1120, 1280, 800];
        
        const colorSpectrum = [
            { name: '红色', hueMin: 0, hueMax: 15 }, { name: '红色', hueMin: 345, hueMax: 360 },
            { name: '橙色', hueMin: 15, hueMax: 30 }, { name: '黄色', hueMin: 30, hueMax: 60 },
            { name: '绿色', hueMin: 60, hueMax: 120 }, { name: '青色', hueMin: 120, hueMax: 180 },
            { name: '蓝色', hueMin: 180, hueMax: 270 }, { name: '紫色', hueMin: 270, hueMax: 345 }
        ];
        
        let stableColorTag = -1, stableColorCount = 0;
        const COLOR_STABLE_FRAMES = 3;
        let lastColorEdgeTag = -1;
        let lastColorSoundTime = 0;
        let activeOscillators = [], activeGains = [];
        
        let edgeJumpTimer = null;
        let pendingResume = false;
        
        // ========== 单物体锁定 ==========
        let isSingleObjectMode = false;
        let lockedHSV = null;
        let currentFrameHSV = null;
        let isTargetLost = false;
        
        let lastWhiteGlideTime = 0;
        const WHITE_GLIDE_COOLDOWN = 800;
        
        function isSameObject(cur, tgt) {
            if (!cur || !tgt) return false;
            const isTgtDark = tgt.v < 0.25;
            const isTgtGrey = tgt.s < 0.25;
            if (isTgtDark) {
                if (cur.v > 0.35) return false;
                return true;
            }
            if (isTgtGrey) {
                if (cur.s > 0.35) return false;
                if (Math.abs(cur.v - tgt.v) > 0.4) return false;
                return true;
            }
            if (cur.v < 0.20 || cur.s < 0.20) return false;
            let diffH = Math.abs(cur.h - tgt.h);
            if (diffH > 180) diffH = 360 - diffH;
            const MAX_HUE_DIFF = 18;
            const MAX_SAT_DIFF = 0.30;
            const MAX_VAL_DIFF = 0.35;
            if (diffH > MAX_HUE_DIFF) return false;
            if (Math.abs(cur.s - tgt.s) > MAX_SAT_DIFF) return false;
            if (Math.abs(cur.v - tgt.v) > MAX_VAL_DIFF) return false;
            return true;
        }

        function hasContinuousRegion(imageData, centerX, centerY, targetHSV) {
            const W = imageData.width, H = imageData.height;
            const data = imageData.data;
            const centerIdx = (Math.floor(centerY) * W + Math.floor(centerX)) * 4;
            const r = data[centerIdx], g = data[centerIdx+1], b = data[centerIdx+2];
            const centerHSV = rgbToHsv(r, g, b);
            if (!isSameObject(centerHSV, targetHSV)) return false;
            
            const winSize = 24;
            const half = winSize >> 1;
            const startX = Math.max(0, Math.floor(centerX) - half);
            const startY = Math.max(0, Math.floor(centerY) - half);
            const endX = Math.min(W-1, startX + winSize);
            const endY = Math.min(H-1, startY + winSize);
            
            const queue = [];
            const visited = new Uint8Array(W * H);
            const startIdx = Math.floor(centerY) * W + Math.floor(centerX);
            queue.push(startIdx);
            visited[startIdx] = 1;
            
            let area = 0;
            const dirs = [-1, 1, -W, W, -W-1, -W+1, W-1, W+1];
            
            while (queue.length && area < 200) {
                const idx = queue.shift();
                area++;
                const y = Math.floor(idx / W);
                const x = idx % W;
                for (const d of dirs) {
                    const nidx = idx + d;
                    if (nidx < 0 || nidx >= W*H) continue;
                    const ny = Math.floor(nidx / W);
                    const nx = nidx % W;
                    if (nx < startX || nx > endX || ny < startY || ny > endY) continue;
                    if (visited[nidx]) continue;
                    const pixelIdx = nidx * 4;
                    const nr = data[pixelIdx], ng = data[pixelIdx+1], nb = data[pixelIdx+2];
                    const nHSV = rgbToHsv(nr, ng, nb);
                    if (isSameObject(nHSV, targetHSV)) {
                        visited[nidx] = 1;
                        queue.push(nidx);
                    }
                }
            }
            return area >= 15;
        }
        
        // ========== 辅助函数 ==========
        function whiteBalance(rgbImage, w, h) {
            let sumR=0,sumG=0,sumB=0, total=w*h;
            for(let i=0;i<total;i++){ sumR+=rgbImage[i*4]; sumG+=rgbImage[i*4+1]; sumB+=rgbImage[i*4+2]; }
            const avgR=sumR/total, avgG=sumG/total, avgB=sumB/total, gray=(avgR+avgG+avgB)/3;
            const gainR=gray/avgR, gainG=gray/avgG, gainB=gray/avgB;
            for(let i=0;i<total;i++){ rgbImage[i*4]=Math.min(255,rgbImage[i*4]*gainR); rgbImage[i*4+1]=Math.min(255,rgbImage[i*4+1]*gainG); rgbImage[i*4+2]=Math.min(255,rgbImage[i*4+2]*gainB); }
        }
        function rgbToHsv(r,g,b){ r/=255;g/=255;b/=255; const max=Math.max(r,g,b),min=Math.min(r,g,b),v=max,delta=max-min; let h=0,s=0; if(delta!==0){ s=delta/max; if(max===r)h=(g-b)/delta+(g<b?6:0); else if(max===g)h=(b-r)/delta+2; else h=(r-g)/delta+4; h*=60; } return {h,s,v}; }
        
        function getTagIndexFromHsv(h, s, v) {
            if (s < 0.15 && v > 0.5) return 7;
            if (v < 0.2) return -1;
            if (s < 0.2) return -1;
            if (h < 20 || h >= 340) return 0;
            if (h < 40) return 1;
            if (h < 70) return 2;
            if (h < 160) return 3;
            if (h < 200) return 4;
            if (h < 260) return 5;
            if (h < 300) return 6;
            return 0;
        }
        
        function extractLightFeatures(imgData) {
            const data = imgData.data, W = imgData.width, H = imgData.height;
            const luminances = []; let sumL = 0, count = 0;
            for (let i = 0; i < data.length; i += 4) { 
                const r = data[i], g = data[i+1], b = data[i+2], L = 0.299*r + 0.587*g + 0.114*b; 
                luminances.push(L); sumL += L; count++; 
            }
            if (count === 0) return null;
            const meanLum = sumL / count;
            let maxGrad = 0;
            for (let y = 1; y < H-1; y++) {
                for (let x = 1; x < W-1; x++) { 
                    const idx = y*W + x, gx = luminances[idx+1] - luminances[idx-1], gy = luminances[idx+W] - luminances[idx-W];
                    const mag = Math.sqrt(gx*gx + gy*gy); 
                    if (mag > maxGrad) maxGrad = mag; 
                }
            }
            let maxVar = 0; const BLOCK = 4;
            for (let by = 0; by < H; by += BLOCK) {
                for (let bx = 0; bx < W; bx += BLOCK) {
                    const vals = []; 
                    for (let dy = 0; dy < BLOCK && by+dy < H; dy++) {
                        for (let dx = 0; dx < BLOCK && bx+dx < W; dx++) {
                            vals.push(luminances[(by+dy)*W + (bx+dx)]);
                        }
                    }
                    const mean = vals.reduce((a,b) => a+b, 0) / vals.length;
                    const vari = vals.reduce((s, v) => s + (v-mean)**2, 0) / vals.length;
                    if (vari > maxVar) maxVar = vari;
                }
            }
            return {
                intensity: meanLum / 255,
                sharpness: Math.min(1, maxGrad / 200),
                disturbance: Math.min(1, maxVar / 2000),
                edgeStrength: Math.min(1, maxGrad / 150),
                raw: { meanLum, maxGrad, maxVar }
            };
        }
        
        function getGray(imgData) { 
            const g = new Uint8ClampedArray(imgData.width * imgData.height), d = imgData.data; 
            for (let i = 0, j = 0; i < d.length; i += 4, j++) g[j] = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]; 
            return g; 
        }
        function initTrackPoints(g, w, h, cx, cy) { 
            const pts = [], step = Math.floor(w / 4); 
            for (let i = 0; i < TRACK_POINTS; i++) { 
                let x, y; 
                if (i === 0) { x = cx; y = cy; } 
                else { 
                    const ang = (i / TRACK_POINTS) * Math.PI * 2, r = step * 0.8; 
                    x = Math.floor(cx + Math.cos(ang) * r); y = Math.floor(cy + Math.sin(ang) * r); 
                } 
                x = Math.max(TEMPL_HALF, Math.min(w - 1 - TEMPL_HALF, x)); 
                y = Math.max(TEMPL_HALF, Math.min(h - 1 - TEMPL_HALF, y)); 
                pts.push({x, y}); 
            } 
            return pts; 
        }
        function trackPoint(pg, cg, w, h, px, py) {
            let bx = px, by = py, best = Infinity; 
            const x1 = Math.max(TEMPL_HALF, px - TRACK_WIN), x2 = Math.min(w - 1 - TEMPL_HALF, px + TRACK_WIN);
            const y1 = Math.max(TEMPL_HALF, py - TRACK_WIN), y2 = Math.min(h - 1 - TEMPL_HALF, py + TRACK_WIN);
            const tsize = TEMPL_HALF * 2 + 1, templ = new Int16Array(tsize * tsize); 
            let tidx = 0;
            for (let dy = -TEMPL_HALF; dy <= TEMPL_HALF; dy++) { 
                const ro = (py + dy) * w; 
                for (let dx = -TEMPL_HALF; dx <= TEMPL_HALF; dx++) templ[tidx++] = pg[ro + (px + dx)]; 
            }
            for (let ty = y1; ty <= y2; ty++) { 
                const ro = ty * w; 
                for (let tx = x1; tx <= x2; tx++) { 
                    let sad = 0, cidx = 0; 
                    for (let dy = -TEMPL_HALF; dy <= TEMPL_HALF; dy++) { 
                        const lo = ro + dy * w; 
                        for (let dx = -TEMPL_HALF; dx <= TEMPL_HALF; dx++) { 
                            sad += Math.abs(templ[cidx++] - cg[lo + (tx + dx)]); 
                            if (sad >= best) break; 
                        } 
                        if (sad >= best) break; 
                    } 
                    if (sad < best) { best = sad; bx = tx; by = ty; } 
                } 
            }
            if (best < tsize * tsize * 20) return { x: bx, y: by, valid: true, disp: Math.hypot(bx - px, by - py) }; 
            return { valid: false, disp: 0 };
        }
        function computeDepthScale(pg, cg, w, h) {
            if (!pg || !trackPoints.length) return 1.0; 
            let sum = 0, cnt = 0; const npts = [];
            for (let p of trackPoints) { 
                const r = trackPoint(pg, cg, w, h, p.x, p.y); 
                if (r.valid) { npts.push({ x: r.x, y: r.y }); sum += r.disp; cnt++; } 
                else npts.push({ x: p.x, y: p.y }); 
            }
            trackPoints = npts; 
            if (cnt === 0) return 1.0; 
            const avg = sum / cnt; 
            return Math.min(1.2, Math.max(0.9, 0.9 + (avg / 8.0) * 0.3));
        }
        function extractAvgHSV(imgData) {
            const d = imgData.data; let sr = 0, sg = 0, sb = 0, c = 0; 
            for (let i = 0; i < d.length; i += 4) { sr += d[i]; sg += d[i+1]; sb += d[i+2]; c++; } 
            if (c === 0) return null;
            const r = sr/c/255, g = sg/c/255, b = sb/c/255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b), v = max, delta = max - min; 
            let h = 0, s = 0;
            if (delta !== 0) { 
                s = delta / max; 
                if (max === r) h = (g - b) / delta + (g < b ? 6 : 0); 
                else if (max === g) h = (b - r) / delta + 2; 
                else h = (r - g) / delta + 4; 
                h *= 60; 
            } 
            return { h, s, v };
        }
        
        // ========== 触觉核心（整体降低频率 + 提升对比度） ==========
        function stopAllLoops() {
            if (lightVibeInterval) { clearTimeout(lightVibeInterval); lightVibeInterval = null; }
        }
        function triggerHardEdgePulse(edgeStrength, intensityDelta) {
            if (!navigator.vibrate) return;
            stopAllLoops(); 
            navigator.vibrate(0);
            let pattern = [], desc = "";
            if (edgeStrength > 0.6) { pattern = [40, 20, 60]; desc = "🟥 锋利切面"; }
            else if (intensityDelta > 0.15) { pattern = [35, 25, 30]; desc = "🔺 猛烈凸起"; }
            else if (intensityDelta < -0.15) { pattern = [20, 40, 40]; desc = "🕳️ 掉落深渊"; }
            else { pattern = [30]; desc = "🟧 细微段落"; }
            navigator.vibrate(pattern);
            edgeJumpSpan.textContent = desc;
            if (edgeJumpTimer) clearTimeout(edgeJumpTimer);
            edgeJumpTimer = setTimeout(() => {
                edgeJumpSpan.textContent = '—';
                if (isRunning) {
                    if (currentColorTag === 7) {
                        scheduleLightVibe();
                    } else if (currentIntensity > DARK_THRESHOLD) {
                        scheduleLightVibe();
                    }
                }
                edgeJumpTimer = null;
                pendingResume = false;
            }, 80); 
            pendingResume = true;
        }
        function stopLightVibration() { 
            stopAllLoops();
            if (edgeJumpTimer) { clearTimeout(edgeJumpTimer); edgeJumpTimer = null; }
            pendingResume = false;
        }
        
        function scheduleLightVibe() {
            if (pendingResume) return;
            
            // 白色：极其微弱且稀疏
            if (currentColorTag === 7) {
                let pulse = 1 + Math.random() * 1;      // 1~2ms
                let interval = 180 + Math.random() * 70; // 180~250ms
                modeSpan.textContent = `⚪ 白色微触`;
                if (navigator.vibrate) navigator.vibrate(Math.floor(pulse));
                lightVibeInterval = setTimeout(() => { if (isRunning) scheduleLightVibe(); }, Math.floor(interval));
                return;
            }
            
            // 非白色：亮度映射（降低频率 + 提高对比度）
            const intensity = currentIntensity;
            if (intensity <= DARK_THRESHOLD) {
                stopLightVibration();
                modeSpan.textContent = '🔕 暗区静音';
                return;
            }
            
            // 新公式：脉冲 1~18ms，间隔 50~180ms，对比度更高
            // 亮度范围 0.1~1.0，映射因子 t = (intensity - 0.1) / 0.9
            let t = (intensity - 0.1) / 0.9;
            let pulse = 1 + t * 17;        // 1 ~ 18ms
            let interval = 180 - t * 130;   // 180 ~ 50ms
            
            pulse += (Math.random() - 0.5) * 1.5;
            interval += (Math.random() - 0.5) * 8;
            pulse = Math.max(1, Math.min(18, pulse));
            interval = Math.max(45, Math.min(185, interval));
            
            modeSpan.textContent = `🌞 亮度振动 ${Math.round(intensity*100)}%`;
            
            if (navigator.vibrate) navigator.vibrate(Math.floor(pulse));
            lightVibeInterval = setTimeout(() => { if (isRunning) scheduleLightVibe(); }, Math.floor(interval));
        }
        
        function updateLightVibration(intensity, sharpness, disturbance, edgeStrength, depthScale) {
            const wasDark = (currentIntensity <= DARK_THRESHOLD);
            const edgeDelta = edgeStrength - lastEdgeStrength;
            const intensityDelta = intensity - lastIntensity;
            let triggered = false;
            if (edgeStrength > 0.35 && (Math.abs(edgeDelta) > 0.10 || Math.abs(intensityDelta) > 0.15)) {
                triggerHardEdgePulse(edgeStrength, intensityDelta);
                triggered = true;
            }
            currentIntensity = intensity; 
            currentSharpness = sharpness; 
            currentDisturbance = disturbance;
            currentEdgeStrength = edgeStrength; 
            lastEdgeStrength = edgeStrength; 
            lastIntensity = intensity;
            const isDark = (intensity <= DARK_THRESHOLD);
            if (!triggered && (wasDark !== isDark || !lightVibeInterval)) {
                if (!pendingResume) { 
                    stopLightVibration(); 
                    if (currentColorTag === 7) {
                        scheduleLightVibe();
                    } else if (!isDark) {
                        scheduleLightVibe();
                    }
                }
            }
            debugSpan.innerHTML = `亮度:${intensity.toFixed(2)} 边缘:${edgeStrength.toFixed(2)} 颜色:${currentColorTag>=0?COLOR_NAMES[currentColorTag]:'无'}`;
        }
        
        // ========== 颜色声音系统 ==========
        function stopAllColorSounds() {
            activeOscillators.forEach(osc => { try { osc.stop(); } catch(e) {} osc.disconnect(); });
            activeGains.forEach(gain => gain.disconnect());
            activeOscillators = [];
            activeGains = [];
        }
        
        function playColorChord(tagIndex, s, v) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (tagIndex < 0 || tagIndex === 7) return;
            
            stopAllColorSounds();
            const freqs = COLOR_CHORDS[tagIndex];
            const now = audioCtx.currentTime;
            const baseGain = 0.1 + v * 0.2;
            freqs.forEach(freq => {
                const gain = audioCtx.createGain();
                gain.gain.value = 0;
                gain.connect(audioCtx.destination);
                activeGains.push(gain);
                const osc = audioCtx.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = freq;
                osc.connect(gain);
                activeOscillators.push(osc);
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(baseGain, now + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            });
            colorSpan.textContent = `${COLOR_NAMES[tagIndex]} ${CHORD_TYPES[tagIndex]} S:${Math.round(s*100)}%`;
        }
        
        function playWhiteGlideSound(v) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = performance.now();
            if (now - lastWhiteGlideTime < WHITE_GLIDE_COOLDOWN) return;
            lastWhiteGlideTime = now;
            
            stopAllColorSounds();
            const audioNow = audioCtx.currentTime;
            const gain = audioCtx.createGain();
            gain.gain.value = 0;
            gain.connect(audioCtx.destination);
            activeGains.push(gain);
            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.value = 900;
            osc.connect(gain);
            activeOscillators.push(osc);
            const baseGain = 0.12 + v * 0.2;
            gain.gain.setValueAtTime(0, audioNow);
            gain.gain.linearRampToValueAtTime(baseGain, audioNow + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, audioNow + 0.6);
            osc.frequency.setValueAtTime(900, audioNow);
            osc.frequency.linearRampToValueAtTime(180, audioNow + 0.5);
            osc.start(audioNow);
            osc.stop(audioNow + 0.6);
            colorSpan.textContent = `白色 滑音 (强→弱)`;
        }
        
        function playColorEdgeSound() {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const gain = audioCtx.createGain();
            gain.gain.value = 0.2;
            gain.connect(audioCtx.destination);
            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.value = 1400;
            osc.connect(gain);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);
            colorEdgeSpan.textContent = '🔔 色边滴';
            setTimeout(() => { colorEdgeSpan.textContent = '—'; }, 150);
        }
        
        function drawProbe(cx, cy, color = '#00ffcc') { 
            ctx.beginPath(); ctx.arc(cx, cy, 12, 0, 2 * Math.PI); 
            ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.shadowColor = color; 
            ctx.shadowBlur = 10; ctx.stroke(); ctx.shadowBlur = 0; 
            ctx.beginPath(); ctx.arc(cx, cy, 2, 0, 2 * Math.PI); 
            ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 8; ctx.fill(); ctx.shadowBlur = 0; 
        }
        
        // ========== 帧循环 ==========
        function processFrame() {
            if (!isRunning) return;
            if (video.videoWidth) {
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);
                const cx = canvas.width / 2, cy = canvas.height / 2;
                const sampleSize = 16;
                const imgData = ctx.getImageData(cx - sampleSize/2, cy - sampleSize/2, sampleSize, sampleSize);
                const lightFeatures = extractLightFeatures(imgData);
                
                frameSkipCounter++;
                if (frameSkipCounter >= DEPTH_UPDATE_INTERVAL) {
                    frameSkipCounter = 0;
                    const processW = 160, processH = Math.floor(processW * canvas.height / canvas.width);
                    const offCanvas = document.createElement('canvas'); offCanvas.width = processW; offCanvas.height = processH;
                    const offCtx = offCanvas.getContext('2d'); offCtx.drawImage(canvas, 0, 0, processW, processH);
                    const offImgData = offCtx.getImageData(0, 0, processW, processH);
                    const curGray = getGray(offImgData);
                    if (needInitPoints || !prevGray) {
                        trackPoints = initTrackPoints(curGray, processW, processH, processW/2, processH/2);
                        needInitPoints = false;
                    }
                    currentDepthScale = computeDepthScale(prevGray, curGray, processW, processH);
                    prevGray = curGray;
                }
                depthSpan.textContent = `深度: ${currentDepthScale.toFixed(2)}`;
                
                const avgHSV = extractAvgHSV(imgData);
                currentFrameHSV = avgHSV;
                if (avgHSV) {
                    currentColorTag = getTagIndexFromHsv(avgHSV.h, avgHSV.s, avgHSV.v);
                } else {
                    currentColorTag = -1;
                }
                
                let shouldProcess = true;
                if (isSingleObjectMode) {
                    if (isSameObject(currentFrameHSV, lockedHSV)) {
                        if (hasContinuousRegion(ctx.getImageData(cx-12, cy-12, 24, 24), 12, 12, lockedHSV)) {
                            isTargetLost = false;
                            lockStatusSpan.textContent = `🔒 锁定追踪中`;
                            modeSpan.textContent = '🎯 物体模式';
                        } else {
                            isTargetLost = true;
                            shouldProcess = false;
                            lockStatusSpan.textContent = `⚠️ 非连续区域`;
                            modeSpan.textContent = '⛔ 静默';
                        }
                    } else {
                        isTargetLost = true;
                        shouldProcess = false;
                        lockStatusSpan.textContent = `❌ 偏离目标`;
                        modeSpan.textContent = '⛔ 静默';
                    }
                } else {
                    lockStatusSpan.textContent = '🔓 自由';
                    modeSpan.textContent = '🔘 自由探索';
                }
                
                if (shouldProcess) {
                    if (lightFeatures) {
                        updateLightVibration(lightFeatures.intensity, lightFeatures.sharpness, lightFeatures.disturbance, lightFeatures.edgeStrength, currentDepthScale);
                        lightSpan.innerHTML = `亮度 ${Math.round(lightFeatures.intensity*100)}%`;
                    } else { 
                        lightSpan.innerHTML = '无光'; 
                        stopLightVibration(); 
                    }
                    
                    if (avgHSV) {
                        const currentTag = getTagIndexFromHsv(avgHSV.h, avgHSV.s, avgHSV.v);
                        if (lastColorEdgeTag !== -1 && currentTag !== lastColorEdgeTag) playColorEdgeSound();
                        lastColorEdgeTag = currentTag;
                        
                        if (currentTag === stableColorTag) stableColorCount++;
                        else { stableColorTag = currentTag; stableColorCount = 1; }
                        
                        const effectiveTag = (stableColorCount >= COLOR_STABLE_FRAMES) ? stableColorTag : currentTag;
                        
                        if (effectiveTag >= 0) {
                            if (effectiveTag === 7) {
                                playWhiteGlideSound(avgHSV.v);
                            } else {
                                const now = performance.now();
                                const interval = COLOR_INTERVALS[effectiveTag];
                                if (now - lastColorSoundTime >= interval) {
                                    playColorChord(effectiveTag, avgHSV.s, avgHSV.v);
                                    lastColorSoundTime = now;
                                }
                            }
                        } else {
                            stopAllColorSounds();
                            colorSpan.textContent = '无色';
                        }
                    } else { 
                        stopAllColorSounds(); 
                        colorSpan.textContent = '无色'; 
                    }
                } else {
                    stopLightVibration();
                    stopAllColorSounds();
                    lightSpan.innerHTML = '--';
                    colorSpan.textContent = '静默';
                }
                
                materialHintSpan.textContent = '(已注释)';
                let probeColor = '#00ffcc';
                if (isSingleObjectMode) {
                    probeColor = isTargetLost ? '#888888' : '#ffaa00';
                }
                drawProbe(cx, cy, probeColor);
            }
            frameId = requestAnimationFrame(processFrame);
        }
        
        // ========== 触摸事件 ==========
        function handleTouchStart(e) {
            if (!isRunning) return;
            e.preventDefault();
            if (currentFrameHSV) {
                isSingleObjectMode = true;
                lockedHSV = { ...currentFrameHSV };
                if (navigator.vibrate) navigator.vibrate(10);
            }
        }
        function handleTouchEnd(e) {
            e.preventDefault();
            isSingleObjectMode = false;
            lockedHSV = null;
            isTargetLost = false;
        }
        
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: 640, height: 480 } });
                video.srcObject = stream;
                await new Promise(r => video.onloadedmetadata = r);
                await video.play();
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') await audioCtx.resume();
                if (navigator.vibrate) navigator.vibrate(1);
                isRunning = true;
                
                canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
                canvas.addEventListener('touchend', handleTouchEnd);
                canvas.addEventListener('touchcancel', handleTouchEnd);
                canvas.addEventListener('mousedown', handleTouchStart);
                canvas.addEventListener('mouseup', handleTouchEnd);
                canvas.addEventListener('mouseleave', handleTouchEnd);
                
                processFrame(); 
                startBtn.textContent = "运行中"; startBtn.disabled = true;
                lastColorSoundTime = performance.now();
                lastWhiteGlideTime = performance.now();
            } catch(e) { debugSpan.innerHTML = "错误: " + e.message; }
        }
        
        startBtn.onclick = startCamera;
        window.addEventListener('beforeunload', () => { 
            isRunning = false; stopLightVibration(); stopAllColorSounds(); 
            if (frameId) cancelAnimationFrame(frameId); 
            if (stream) stream.getTracks().forEach(t => t.stop()); 
            if (audioCtx) audioCtx.close(); 
        });
    })();
</script>
